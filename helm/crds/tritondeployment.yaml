apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tritondeployments.tarn.varga.io
spec:
  group: tarn.varga.io
  names:
    kind: TritonDeployment
    listKind: TritonDeploymentList
    plural: tritondeployments
    singular: tritondeployment
    shortNames:
      - td
      - triton
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image, modelRepository]
              properties:
                image:
                  type: string
                  description: Triton Docker image (e.g. nvcr.io/nvidia/tritonserver:24.09-py3).
                modelRepository:
                  type: string
                  description: Model repository location (hdfs://..., s3://..., or a PVC mount path).
                replicas:
                  type: integer
                  minimum: 0
                  default: 1
                tensorParallelism:
                  type: integer
                  minimum: 1
                  default: 1
                pipelineParallelism:
                  type: integer
                  minimum: 1
                  default: 1
                accelerator:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [nvidia_gpu, amd_gpu, intel_gaudi, aws_neuron, cpu_only]
                      default: nvidia_gpu
                    count:
                      type: integer
                      minimum: 0
                      default: 1
                    profile:
                      type: string
                      description: |
                        NVIDIA MIG profile name. When set, pods request
                        nvidia.com/mig-<profile> instead of nvidia.com/gpu. Only valid when
                        type=nvidia_gpu and MIG is enabled on the underlying nodes. Mutually
                        exclusive with sliceSize.
                      enum: ["1g.5gb", "1g.10gb", "2g.10gb", "2g.20gb", "3g.20gb", "3g.40gb", "4g.20gb", "4g.40gb", "6g.40gb", "7g.40gb", "7g.80gb"]
                    sliceSize:
                      type: string
                      description: |
                        Decimal fraction of an accelerator unit for time-slicing / MPS
                        (e.g. "0.5"). Passed through as a pod annotation; the device plugin
                        on the node must understand it. Mutually exclusive with profile.
                      pattern: '^[0-9]+(\.[0-9]+)?$'
                resources:
                  type: object
                  properties:
                    memory:
                      type: string
                      default: "4Gi"
                    cpu:
                      type: string
                      default: "2"
                openaiProxy:
                  type: object
                  description: Opt-in OpenAI-compatible frontend in each Triton pod.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    port:
                      type: integer
                      default: 9000
                scaling:
                  type: object
                  description: Horizontal autoscaling policy.
                  properties:
                    mode:
                      type: string
                      enum: [gpu_util, queue_depth, composite]
                      default: composite
                    minReplicas:
                      type: integer
                      minimum: 0
                      default: 1
                    maxReplicas:
                      type: integer
                      minimum: 1
                      default: 10
                    upThreshold:
                      type: number
                      default: 0.7
                    downThreshold:
                      type: number
                      default: 0.2
                ranger:
                  type: object
                  properties:
                    serviceName:
                      type: string
                    strict:
                      type: boolean
                      default: true
                quotasRef:
                  type: object
                  description: Optional reference to a ConfigMap containing the quotas JSON.
                  properties:
                    configMapName:
                      type: string
                    key:
                      type: string
                      default: quotas.json
                env:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string }
                      value: { type: string }
                gateway:
                  type: object
                  description: |
                    When enabled and spec.traffic is set, the operator emits a Gateway API
                    HTTPRoute (gateway.networking.k8s.io/v1) with precise backendRef weights
                    instead of relying on K8s Service round-robin for approximate split.
                    Requires a Gateway-class controller (Istio, Cilium, Envoy Gateway, etc.)
                    on the cluster.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    parentRefs:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: { type: string, description: Name of the Gateway to attach to. }
                          namespace: { type: string }
                          sectionName: { type: string, description: Listener section on the Gateway. }
                    hostnames:
                      type: array
                      items: { type: string }
                traffic:
                  type: array
                  description: |
                    Weighted traffic split across cohorts (canary / blue-green / A-B). When set,
                    spec.replicas is interpreted as the TOTAL across all variants and each variant
                    receives replicas proportional to its weight (minimum 1). A single Service
                    fronts every variant — K8s round-robin on endpoints approximates the split.
                    For precise % routing, enable spec.gateway to emit a Gateway API HTTPRoute.
                  items:
                    type: object
                    required: [name, weight]
                    properties:
                      name:
                        type: string
                        description: Variant name (e.g. v1, v2, canary). Must be DNS-safe — used as a pod label.
                        pattern: '^[a-z0-9]([-a-z0-9]{0,62}[a-z0-9])?$'
                      weight:
                        type: integer
                        minimum: 0
                        description: Relative weight. 0 drains the variant but keeps it reachable via X-TARN-Variant header.
                      modelRepository:
                        type: string
                        description: Override spec.modelRepository for this variant (typically a different model version).
                      image:
                        type: string
                        description: Override spec.image for this variant.
                      analysis:
                        type: object
                        description: |
                          Marks this variant as a canary. After observationWindowSec the
                          operator queries Prometheus; if the variant's error rate is below
                          errorRateThreshold and its p95 stays within latencyP95RatioMax of
                          the dominant variant, it is automatically promoted to 100%.
                        properties:
                          errorRateThreshold:
                            type: number
                            minimum: 0
                            maximum: 1
                            default: 0.01
                          latencyP95RatioMax:
                            type: number
                            minimum: 1
                            default: 1.5
                          observationWindowSec:
                            type: integer
                            minimum: 60
                            default: 300
                          prometheusUrl:
                            type: string
                            description: Override the operator-wide PROMETHEUS_URL for this CR.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Reconciling, Ready, Degraded, Failed, Terminating]
                canaryAnalysis:
                  type: object
                  properties:
                    state:
                      type: string
                      enum: [Running, Succeeded, Failed, Unknown]
                    variant:
                      type: string
                    startTime:
                      type: string
                    lastMessage:
                      type: string
                readyReplicas:
                  type: integer
                targetReplicas:
                  type: integer
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: { type: string }
                      status: { type: string, enum: [True, False, Unknown] }
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Target
          type: integer
          jsonPath: .status.targetReplicas
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
